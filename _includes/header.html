<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="36" height="36">
      <span class="brand-text"><span class="brand-name">{{ site.title }}</span><span class="brand-sub">University of Minho · INESC TEC</span></span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav">
      {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
