<svg class="synergy" viewBox="0 0 960 440" role="img" aria-labelledby="syn-title syn-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="syn-title">Four research lines around one goal: resource efficiency for HPC systems</title>
  <desc id="syn-desc">Resource efficiency for HPC systems is the common goal at the centre. Four lines branch from it: energy and carbon efficiency, memory disaggregation, emerging architectures and scientific computing. Memory disaggregation lets existing systems process workloads larger than one node's memory, which extends the life of the hardware. Emerging architectures lower energy per operation. Scientific computing supplies HPC kernels and large-memory workloads.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="syn-arrowhead"/></marker>
    <marker id="arr-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" class="syn-chainhead"/></marker>
  </defs>

  <!-- spokes from the common goal to each line (drawn first, boxes cover their ends) -->
  <path d="M480 220 L170 80"  class="syn-spoke s-energy"/>
  <path d="M480 220 L790 80"  class="syn-spoke s-memory"/>
  <path d="M480 220 L170 360" class="syn-spoke s-architectures"/>
  <path d="M480 220 L790 360" class="syn-spoke s-science"/>

  <!-- cross-links between lines -->
  <path d="M80 298 V144" class="syn-edge" marker-end="url(#arr)"/>
  <text x="92" y="216" class="syn-e start">energy per</text>
  <text x="92" y="232" class="syn-e start">operation</text>
  <path d="M880 298 V144" class="syn-edge" marker-end="url(#arr)"/>
  <text x="868" y="216" class="syn-e end">large-memory</text>
  <text x="868" y="232" class="syn-e end">workloads</text>
  <path d="M638 392 H324" class="syn-edge" marker-end="url(#arr)"/>
  <text x="481" y="414" class="syn-e">HPC kernels to evaluate</text>

  <!-- the four lines -->
  <g class="syn-node node-energy">
    <rect x="20" y="20" width="300" height="120" rx="14"/>
    <text x="170" y="56" class="syn-h c-energy">Energy &amp; carbon efficiency</text>
    <text x="122" y="84" class="syn-t end">measure</text>
    <path d="M128 79.5 H146" class="syn-chain" marker-end="url(#arr-e)"/>
    <text x="170" y="84" class="syn-t">model</text>
    <path d="M194 79.5 H212" class="syn-chain" marker-end="url(#arr-e)"/>
    <text x="218" y="84" class="syn-t start">decide</text>
    <text x="170" y="106" class="syn-t">Arm power controls · WAVE</text>
    <text x="170" y="124" class="syn-t">carbon-aware scheduling</text>
  </g>
  <g class="syn-node node-memory">
    <rect x="640" y="20" width="300" height="120" rx="14"/>
    <text x="790" y="56" class="syn-h c-memory">Memory disaggregation</text>
    <text x="790" y="84" class="syn-t">pooling memory across nodes</text>
    <text x="790" y="106" class="syn-t">application-level data placement</text>
    <text x="790" y="124" class="syn-t">longer life for existing systems</text>
  </g>
  <g class="syn-node node-architectures">
    <rect x="20" y="300" width="300" height="120" rx="14"/>
    <text x="170" y="336" class="syn-h c-architectures">Emerging architectures</text>
    <text x="170" y="364" class="syn-t">CGRA design-space exploration</text>
    <text x="170" y="386" class="syn-t">cross-architecture</text>
    <text x="170" y="404" class="syn-t">characterisation</text>
  </g>
  <g class="syn-node node-science">
    <rect x="640" y="300" width="300" height="120" rx="14"/>
    <text x="790" y="336" class="syn-h c-science">Scientific computing</text>
    <text x="790" y="364" class="syn-t">HEP · quantum photonics · materials</text>
    <text x="790" y="386" class="syn-t">performance engineering of</text>
    <text x="790" y="404" class="syn-t">production science codes</text>
  </g>

  <!-- common goal -->
  <g class="syn-hub">
    <rect x="335" y="160" width="290" height="120" rx="60"/>
    <text x="480" y="202" class="hub-h">Resource Efficiency</text>
    <text x="480" y="226" class="hub-s">for HPC systems</text>
    <text x="480" y="254" class="hub-t">per joule · per gram CO₂ · per byte</text>
  </g>
</svg>
