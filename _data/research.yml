# One entry per research line. "id" tags publications, people, projects and tools.
# figure: illustration under /assets/img/research/
- id: energy
  title: Energy & Carbon Efficiency
  short: Energy
  icon: bolt
  figure: /assets/img/research/energy.svg
  lead: >-
    More useful computation per joule and per gram of CO₂, from processor power
    controls to the scheduling of whole machines.
  topics:
    - title: Arm power controls
      text: A64FX eco mode, retention and DVFS; NVIDIA Grace frequency scaling and core hotplug.
    - title: System energy modelling
      text: WAVE simulates HPC jobs together with node power, PUE, storage and grid supply.
    - title: Carbon-aware scheduling
      text: Fitting the energy of jobs to hourly green-energy budgets.

- id: memory
  title: Memory Disaggregation
  short: Memory
  icon: memory
  figure: /assets/img/research/memory.svg
  lead: >-
    Using the memory of several nodes so that existing systems can process
    workloads that do not fit in a single node, which extends the life of the
    hardware.
  topics:
    - title: Remote memory over MPI
      text: Middleware that places an application's data objects in the memory of other nodes.
    - title: Application-level placement
      text: Cost models and policies that put each data structure in the most suitable memory pool.
    - title: Longer hardware life
      text: Capacity-limited nodes, such as the 32 GiB A64FX, can take on larger problems.

- id: architectures
  title: Emerging Architectures
  short: Architectures
  icon: chip
  figure: /assets/img/research/architectures.svg
  lead: >-
    Matching HPC workloads to the architectures that run them with the least
    energy per operation.
  topics:
    - title: CGRA design-space exploration
      text: Mapping dataflow graphs onto candidate arrays, refined with Bayesian optimisation.
    - title: HPC kernels on CGRAs
      text: Stencils, sparse operations and FP64, beyond the usual edge workloads.
    - title: Cross-architecture studies
      text: Measured rooflines and portable code on Arm, x86 and GPU nodes.

- id: science
  title: Scientific Computing
  short: Science
  icon: atom
  figure: /assets/img/research/science.svg
  lead: >-
    Applying the research from our other lines to real scientific code, so that
    domain scientists get faster and more efficient applications.
  topics:
    - title: High-energy physics
      text: HEP-Frame, efficient pipelined analysis of LHC data.
    - title: Quantum photonics
      text: Optimising the QUANTHOS simulation workflow on Arm and x86 nodes.
    - title: Materials science
      text: HPC support for DFT post-processing codes such as Berry.
