  bio: >-
    André leads the Resource Efficiency Group. His research covers energy and
    carbon efficiency of supercomputers, memory disaggregation, emerging
    architectures and the performance engineering of scientific codes. It grew
    from earlier work on efficient data analysis for the LHC (HEP-Frame). He
    helped design UMinho's Master in Advanced Computing and has been its Adjunct
    Director since its first edition. He teaches Advanced Computing Architectures
    in the Master and parallel programming and computing systems at BSc level. At INESC TEC he contributes to EPICURE, the EuroHPC
    application-support project.
