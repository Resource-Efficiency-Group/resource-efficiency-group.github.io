- name: EPICURE
  full_name: High-level specialised application support service in High-Performance Computing
  status: active
  period: Feb 2024 – Jan 2028
  funding: EuroHPC Joint Undertaking · Digital Europe Programme
  url: https://epicure-hpc.eu
  summary: >-
    EPICURE brings together the hosting entities of the EuroHPC supercomputers
    to give users Level 2 and Level 3 application support, such as porting,
    scaling and optimisation, and advanced training. The consortium has 16
    partners from 14 countries and is coordinated by CSC (Finland). INESC TEC is
    the Portuguese partner, which includes support for Deucalion users.
  role: >-
    Member of the INESC TEC team, contributing to the Advanced Training work
    package (see the year-1 training activities report).
  lines: []

- name: QUANTHOS
  full_name: Quantum Topological Integrated Photonics
  status: active
  period: ""                     # TODO
  funding: FCT — Exploratory Research Projects
  url: ""
  summary: >-
    QUANTHOS tests whether the topological protection of light, already
    demonstrated for classical optics, extends to quantum states of light, and
    builds simulation frameworks for designing quantum photonic circuits. The
    principal investigator is Ariel Guerreiro (INESC TEC).
  role: >-
    HPC optimisation of the project's quantum-transport simulation workflow on
    the x86 and Arm partitions of Deucalion (MSc dissertation).
  lines: [science]

- name: Sustainable HPC
  full_name: Highly Sustainable High-Performance Computing
  status: active
  period: Jul 2021 – Dec 2025
  funding: Fundo de Apoio à Inovação and Fundo de Eficiência Energética (Portugal)
  url: ""
  summary: >-
    Sustainable HPC develops an energy-management system that minimises the
    carbon footprint of Deucalion's operation. It coordinates computing and
    energy resources: on-site solar and wind generation, second-life battery
    storage, the grid, cooling, and the computing workload itself. Predictive
    models decide at each moment which mix of resources gives the cleanest
    operation. The consortium is INESC TEC and INEGI, and the global budget is
    €7.3M.
  role: >-
    INESC TEC partner team. The group contributes the computing side, that is,
    how HPC workloads and system operation shape energy use and carbon
    emissions. This work includes our review on the decarbonisation of HPC
    centres.
  links:
    - label: "Review: decarbonisation of HPC centres (RSER 2024)"
      url: https://doi.org/10.1016/j.rser.2023.114019
  lines: [energy]

- name: exaSIMPLE
  full_name: A Hybrid ML-CFD SIMPLE Algorithm for the Exascale Era
  status: completed
  period: Mar 2024 – Feb 2025
  funding: Inno4scale · EuroHPC Joint Undertaking
  url: https://www.inesctec.pt/en/projects/exasimple
  summary: >-
    exaSIMPLE prepares SIMPLE-type CFD solvers for exascale systems by bringing
    machine learning into the solver. Graph neural networks replace the linear
    solver of the pressure-correction equation, and a data-driven model improves
    pressure-velocity coupling. The work builds on the industrial CFD code
    ReFRESCO with PETSc and PyTorch, and ran on Deucalion's CPU and GPU nodes.
    The consortium was blueOASIS (coordinator), INESC TEC and MARIN (Maritime
    Research Institute Netherlands).
  role: >-
    INESC TEC principal investigator (André Martins Pereira): HPC support on
    Deucalion and optimisation of the solver for heterogeneous CPU-GPU nodes.
  links:
    - label: Code (GitHub)
      url: https://github.com/blueOceanSustainableSolutions/exaSIMPLE
    - label: Inno4scale success story
      url: https://www.inno4scale.eu/success-story-exasimple/
    - label: blueOASIS case study
      url: https://www.blueoasis.tech/projects/exaSIMPLE-leveraging-machine-learning-for-exascale-CFD
  lines: [science]

- name: Deucalion living laboratory
  full_name: Research and dissertations in cooperation with CNCA
  status: infrastructure
  period: Ongoing
  funding: In cooperation with CNCA, the operator of the EuroHPC supercomputer Deucalion
  url: ""
  summary: >-
    Deucalion is installed on UMinho's Azurém campus. It combines Fujitsu A64FX
    Arm nodes with on-package HBM2, AMD EPYC x86 nodes and NVIDIA A100 GPU
    nodes. Several of our research topics come from discussions with its
    operations team.
  role: >-
    Study of the system's energy behaviour, scheduling, memory use and
    application performance, through MSc dissertations proposed with the
    operations team.
  lines: [energy, memory, architectures, science]

- name: EUMaster4HPC-2
  full_name: European Master for High Performance Computing
  status: education
  period: Ongoing
  funding: EuroHPC Joint Undertaking
  url: ""                       # TODO: consortium website
  summary: >-
    The University of Minho is a Participating University in the second
    EUMaster4HPC consortium, through its Master in Advanced Computing. The
    Master is built around Deucalion: students use the supercomputer in classes
    and in projects, and each dissertation either uses it or addresses a theme
    proposed by its operations team.
  role: >-
    The group leader helped design the Master and is its Adjunct Director.
    Students from the programme carry out MSc dissertations in the group.
  lines: []

