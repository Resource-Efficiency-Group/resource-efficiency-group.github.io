title: Resource Efficiency Group
short_title: REG
tagline: >-
  More science from every joule, every gram of CO₂ and every byte of memory
  in high-performance computing.
description: >-
  The Resource Efficiency Group studies energy and carbon efficiency, memory
  disaggregation, emerging architectures and scientific computing on production
  supercomputers. University of Minho and INESC TEC, Braga, Portugal.

# Deployment. For a repository named <account>.github.io keep baseurl empty.
